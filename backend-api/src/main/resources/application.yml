# 파일: application.yml
# 역할: Spring Boot 메인 설정
# 환경: 공통 설정 + 프로필별 분리

spring:
  application:
    name: backend-api

  profiles:
    active: prod  # 기본 프로필

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 validate, 개발은 프로필에서 오버라이드
    properties:
      hibernate:
        # format_sql은 로컬 개발 전용이라 공통 프로필에서 제거한다.
        # 운영 환경에서 format_sql: true이면 SQL이 보기 좋게 포맷돼서 로그 볼륨이 커진다.
        default_batch_fetch_size: 100
    open-in-view: false  # 성능을 위해 비활성화

  # Flyway 설정
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000      # 1시간
  # 7일(604800000)에서 24시간(86400000)으로 단축한다.
  # 탈취된 refresh token의 유효 기간을 줄여 피해 범위를 좁히기 위해서다.
  # Token Rotation 도입으로 정상 사용자는 자동 갱신되므로 UX 영향은 최소화된다.
  refresh-token-validity-ms: 86400000    # 24시간

# 쿠키 설정
# secure: true → HTTPS에서만 쿠키 전송 (운영/개발 서버 기본값)
# local 프로필에서만 false로 오버라이드한다. HTTP 로컬 환경에서도 쿠키가 동작하게 하기 위해서다.
app:
  cookie:
    secure: true
  cors:
    # 허용할 Origin 목록. 운영/개발에서는 CORS_ALLOWED_ORIGINS 환경변수로 주입한다.
    # 환경변수 미설정 시 로컬 기본값(localhost:3000)만 허용한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI API 설정
ai:
  api:
    enabled: ${AI_API_ENABLED:false}  # 로컬에서는 기본 비활성화
    base-url: ${AI_API_BASE_URL:http://localhost:8081}
    timeout-ms: ${AI_API_TIMEOUT_MS:5000}
    retry-count : 2

# 로깅 설정
logging:
  level:
    root: INFO
    com.mindcompass.api: DEBUG
    org.springframework.security: WARN

# 서버 설정
server:
  port: 8080

---
# 파일: application-local.yml (같은 파일 내 프로필 분리)
# 역할: 로컬 개발 환경 설정

spring:
  config:
    activate:
      on-profile: local

  # H2 인메모리 DB (로컬 개발용)
  datasource:
    url: jdbc:h2:mem:mindcompass;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop  # 로컬에서는 자동 생성
    show-sql: true

  flyway:
    enabled: false  # 로컬에서는 Flyway 비활성화

# AI API 비활성화 (mock 사용)
ai:
  api:
    enabled: false

# 로컬은 HTTP이므로 Secure 쿠키를 false로 오버라이드한다
app:
  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:3000

---
# 파일: application-dev.yml
# 역할: 개발 서버 환경 설정

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

ai:
  api:
    enabled: true

---
# 파일: application-prod.yml
# 역할: 프로덕션 환경 설정

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

ai:
  api:
    enabled: true

logging:
  level:
    root: WARN
    com.mindcompass.api: INFO
